    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'EB Garamond', serif;
            min-height: 100vh;
            width: 100%;
        }

        /* Every path on the site can render this page, so assets and links

           images relative to that directory. */
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 20px;
            text-align: center;
        }

        .not-found-patch {
            max-width: 250px;
            width: 100%;
            height: auto;
        }

        h1 {
            font-family: 'EB Garamond', serif;
            color: black;
            font-size: 64px;
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
        }

        .tagline {
            font-family: 'EB Garamond', serif;
            color: #666666;
            font-size: 32px;
            font-weight: 500;
            margin: 0;
            opacity: 0.8;
            line-height: 1.1;
        }

        .home-link {
            font-family: 'EB Garamond', serif;
            font-size: 24px;
            color: #000000;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .home-link:hover { color: #BE5D1D; }

        @media (max-width: 768px) {
            h1 { font-size: 44px; }
            .tagline { font-size: 26px; }
            .not-found-patch { max-width: 180px; }
        }
    </style>
</head>
<body>
    <main class="not-found">
        <img src="/images/hero-vegetables.webp" alt="TACWU patch" class="not-found-patch" width="1024" height="1024">
